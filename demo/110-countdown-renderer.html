<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>110 — Countdown renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>110 — Countdown renderer</h1>
  <p class="lede">Live T-minus tick to a target time. 1s interval per cell; stops when the row leaves the DOM.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="event" data-header-cell-width-value="240">Event</th>
        <th data-controller="header-cell" data-header-cell-field-value="when" data-header-cell-cell-renderer-value="countdown" data-header-cell-width-value="160">T-minus</th>
        <th data-controller="header-cell" data-header-cell-field-value="when" data-header-cell-cell-renderer-value="countdown-secs" data-header-cell-width-value="180">With seconds</th>
        <th data-controller="header-cell" data-header-cell-field-value="when" data-header-cell-cell-renderer-value="datetime" data-header-cell-width-value="200">Target</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const { registerRenderer, renderers } = StimulusGrid;
    // Always-show-seconds variant: 200ms tick + a formatter that keeps the
    // `s` field on for the d/h cases so the timer visibly moves even for
    // far-away targets.
    registerRenderer('countdown-secs', renderers.countdown({
      interval: 200,
      format: (ms) => {
        if (ms <= 0) return 'expired';
        const total = Math.floor(ms / 1000);
        const d = Math.floor(total / 86400);
        const h = Math.floor((total % 86400) / 3600);
        const m = Math.floor((total % 3600) / 60);
        const s = total % 60;
        if (d > 0) return `${d}d ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        return `${m}:${String(s).padStart(2,'0')}`;
      },
    }));
    const now = Date.now();
    const data = [
      { event: 'Coffee break',        when: new Date(now + 90 * 1000)         },
      { event: 'Standup',              when: new Date(now + 20 * 60 * 1000)    },
      { event: 'Customer call',        when: new Date(now + 2 * 3600 * 1000)   },
      { event: 'Cohort release',       when: new Date(now + 36 * 3600 * 1000)  },
      { event: 'Lapsed test event',    when: new Date(now - 5 * 60 * 1000)      },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
