<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>183 — Site induction | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>183 — Site induction (per-person × per-site)</h1>
  <p class="lede">
    Inducted-for-this-site indicator. Pass a bool for the shorthand,
    or <code>{ inducted, site, expires }</code> for the full pill +
    expiry colour band (12-month refresh is the most common cadence).
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="person"
              data-header-cell-width-value="180">Person</th>
          <th data-controller="header-cell" data-header-cell-field-value="role"
              data-header-cell-width-value="160">Role</th>
          <th data-controller="header-cell" data-header-cell-field-value="induction"
              data-header-cell-cell-renderer-value="site-induction"
              data-header-cell-width-value="340">Induction</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, person: 'Astrid Hale',  role: 'Electrician', induction: { inducted: true, site: 'Bondi Tower',  expires: inDays(320) } },
      { id: 2, person: 'Marcus Chen',  role: 'Plumber',     induction: { inducted: true, site: 'Bondi Tower',  expires: inDays(45) } },
      { id: 3, person: 'Priya Patel',  role: 'Carpenter',   induction: { inducted: true, site: 'Bondi Tower',  expires: inDays(12) } },
      { id: 4, person: 'Jamal Owens',  role: 'Labourer',    induction: { inducted: true, site: 'Bondi Tower',  expires: inDays(-8) } },
      { id: 5, person: 'Lena Brooks',  role: 'Roofer',      induction: false },
      { id: 6, person: 'Tomás Vega',   role: 'Painter',     induction: true },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
