<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>136 — Fraction renderer | stimulus_grid</title><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="../dist/stimulus_grid.css"/><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p.lede{color:#6b7280;margin-top:0}.panel{height:460px;margin-top:16px}.crumbs a{color:#2563eb;text-decoration:none}</style></head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>136 — Fraction renderer</h1>
  <p class="lede">Decimal → closest fraction within a configurable max denominator (default 16). Useful for imperial measurements + baking.</p>
  <div class="panel" data-controller="grid">
    <table><thead><tr>
      <th data-controller="header-cell" data-header-cell-field-value="cut" data-header-cell-width-value="200">Cut</th>
      <th data-controller="header-cell" data-header-cell-field-value="decimal" data-header-cell-type-value="number" data-header-cell-width-value="120">Decimal (in)</th>
      <th data-controller="header-cell" data-header-cell-field-value="decimal" data-header-cell-cell-renderer-value="fraction" data-header-cell-width-value="120">Fraction</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { cut: 'Skirting board',  decimal: 1.25 },
      { cut: 'Bolt length',     decimal: 0.625 },
      { cut: 'Window trim',     decimal: 2.875 },
      { cut: 'Plywood',         decimal: 0.0625 },
      { cut: 'Door frame',      decimal: 3.5 },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body></html>
