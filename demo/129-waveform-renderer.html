<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>129 — Waveform renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>129 — Waveform renderer</h1>
  <p class="lede">Audio-only viz sibling to <code>audio-attachment</code>. Renders an array of normalised amplitudes 0..1, or generates a deterministic waveform from a URL string so the cell doesn't need to fetch the audio.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="call" data-header-cell-width-value="240">Call</th>
        <th data-controller="header-cell" data-header-cell-field-value="audio" data-header-cell-cell-renderer-value="waveform" data-header-cell-width-value="200">Waveform</th>
        <th data-controller="header-cell" data-header-cell-field-value="length" data-header-cell-cell-renderer-value="duration" data-header-cell-width-value="120">Length</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { call: 'Inbound — Astrid',  audio: 'https://example.com/calls/astrid-2026-05-12.mp3',  length: 3 * 60 * 1000 + 14_000 },
      { call: 'Outbound — Marcus', audio: 'https://example.com/calls/marcus-2026-05-13.mp3',  length: 1 * 60 * 1000 + 42_000 },
      { call: 'Demo — Priya',      audio: [0.3, 0.5, 0.4, 0.7, 0.9, 0.8, 0.6, 0.5, 0.3, 0.2, 0.4, 0.6, 0.7, 0.8, 0.5, 0.3, 0.2], length: 18 * 60 * 1000 },
      { call: 'No audio',          audio: null,                                                  length: 0 },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
