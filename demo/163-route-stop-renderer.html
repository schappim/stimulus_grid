<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>163 — Route stop | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>163 — Route stop (position-in-route indicator)</h1>
  <p class="lede">
    Dispatch-board glanceable progress through a tech's day. Renders as
    a dot row + "3 of 7" caption — filled dots up to current position,
    hollow after.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="tech"
              data-header-cell-width-value="180">Technician</th>
          <th data-controller="header-cell" data-header-cell-field-value="route"
              data-header-cell-cell-renderer-value="route-stop"
              data-header-cell-width-value="200">Route</th>
          <th data-controller="header-cell" data-header-cell-field-value="next"
              data-header-cell-width-value="200">Next stop</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, tech: 'Astrid Hale',  route: { position: 5, total: 7 }, next: 'Bondi Pavilion' },
      { id: 2, tech: 'Marcus Chen',  route: { position: 2, total: 6 }, next: 'Vega Studio' },
      { id: 3, tech: 'Priya Patel',  route: { position: 7, total: 7 }, next: '— (done)' },
      { id: 4, tech: 'Jamal Owens',  route: { position: 0, total: 5 }, next: 'Manly Reno Co' },
      { id: 5, tech: 'Lena Brooks',  route: { position: 3, total: 8 }, next: 'Glebe Builders' },
      { id: 6, tech: 'Tomás Vega',   route: { position: 1, total: 4 }, next: 'Newtown Bakery' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
