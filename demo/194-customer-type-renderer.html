<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>194 — Customer type | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>194 — Customer type</h1>
  <p class="lede">
    Categorical pill — Residential / Commercial / Strata / Real Estate /
    Insurance / Builder / Government / Body Corp. Drives invoice
    template, GST treatment, comms tone, and the right T&Cs to attach.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="customer"
              data-header-cell-width-value="240">Customer</th>
          <th data-controller="header-cell" data-header-cell-field-value="type"
              data-header-cell-cell-renderer-value="customer-type"
              data-header-cell-width-value="180">Type</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, customer: 'Bondi Pavilion',           type: 'commercial' },
      { id: 2, customer: 'Vega Studio (residence)',   type: 'residential' },
      { id: 3, customer: 'Manly Strata SP 4421',     type: 'strata' },
      { id: 4, customer: 'Ray White Coogee',          type: 'real-estate' },
      { id: 5, customer: 'NRMA Insurance — Claim',    type: 'insurance' },
      { id: 6, customer: 'Hale Builders Pty Ltd',     type: 'builder' },
      { id: 7, customer: 'Waverley Council',          type: 'government' },
      { id: 8, customer: 'Pacific Apts Body Corp',    type: 'body-corp' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
