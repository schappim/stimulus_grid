<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>162 — Arrival window | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>162 — Arrival window (customer-promised slot)</h1>
  <p class="lede">
    The time slot the dispatcher quoted. Renders as
    "<em>8–10am Tue 27 May</em>" with a traffic-light colour pill:
    <strong>blue</strong> future / <strong>green</strong> open now /
    <strong>amber</strong> overdue &lt; 30 min / <strong>red</strong>
    overdue ≥ 30 min or already past.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="ref"
              data-header-cell-width-value="120">Job #</th>
          <th data-controller="header-cell" data-header-cell-field-value="customer"
              data-header-cell-width-value="180">Customer</th>
          <th data-controller="header-cell" data-header-cell-field-value="window"
              data-header-cell-cell-renderer-value="arrival-window"
              data-header-cell-width-value="240">Arrival</th>
          <th data-controller="header-cell" data-header-cell-field-value="tech"
              data-header-cell-width-value="160">Tech</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const now = new Date();
    const w = (startMinOffset, endMinOffset) => {
      const s = new Date(now); s.setMinutes(s.getMinutes() + startMinOffset);
      const e = new Date(now); e.setMinutes(e.getMinutes() + endMinOffset);
      return { start: s.toISOString(), end: e.toISOString() };
    };

    const ROWS = [
      { id: 1, ref: 'J-1042', customer: 'Bondi Pavilion',  window: w(-180, -120),  tech: 'Astrid Hale' },   // late
      { id: 2, ref: 'J-1043', customer: 'Vega Studio',     window: w(-45, -15),    tech: 'Marcus Chen' },   // overdue
      { id: 3, ref: 'J-1044', customer: 'Coogee Holdings', window: w(-15, 45),     tech: 'Priya Patel' },   // open now
      { id: 4, ref: 'J-1045', customer: 'Manly Reno Co',   window: w(60, 120),     tech: 'Jamal Owens' },   // future today
      { id: 5, ref: 'J-1046', customer: 'Glebe Builders',  window: w(60*24+0, 60*24+120),  tech: 'Lena Brooks' },  // tomorrow
      { id: 6, ref: 'J-1047', customer: 'Newtown Bakery',  window: w(60*48+0, 60*48+60),   tech: 'Tomás Vega' },   // 2 days out
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
