<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>148 — COES renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>148 — COES (VIC Certificate of Electrical Safety)</h1>
  <p class="lede">
    Issued via Energy Safe Victoria after every prescribed electrical
    job. <code>class</code> is normally "Prescribed" or "Non-prescribed";
    <code>expires</code> is the certificate validity window (10 years).
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="job"
              data-header-cell-width-value="160">Job #</th>
          <th data-controller="header-cell" data-header-cell-field-value="rec"
              data-header-cell-width-value="180">REC / LEW</th>
          <th data-controller="header-cell" data-header-cell-field-value="coes"
              data-header-cell-cell-renderer-value="coes"
              data-header-cell-editable-value="true"
              data-header-cell-width-value="340">COES</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, job: 'J-2026-0042', rec: 'Alpha Electrical', coes: { state: 'VIC', number: '7A-99821', class: 'Prescribed', expires: inDays(3500) } },
      { id: 2, job: 'J-2026-0050', rec: 'Beta Solar',        coes: { state: 'VIC', number: '4B-12345', class: 'Prescribed', expires: inDays(2100) } },
      { id: 3, job: 'J-2026-0061', rec: 'Gamma Power',       coes: { state: 'VIC', number: '8A-00045', class: 'Non-prescribed', expires: inDays(80) } },
      { id: 4, job: 'J-2026-0070', rec: 'Delta Sparkies',    coes: { state: 'VIC', number: '7A-99102', class: 'Prescribed', expires: inDays(-12) } },
      { id: 5, job: 'J-2026-0083', rec: 'Epsilon Electric',  coes: { state: 'VIC', number: 'EX-22008' } },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
