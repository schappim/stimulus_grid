<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>135 — Spoiler renderer | stimulus_grid</title><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="../dist/stimulus_grid.css"/><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p.lede{color:#6b7280;margin-top:0}.panel{height:460px;margin-top:16px}.crumbs a{color:#2563eb;text-decoration:none}</style></head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>135 — Spoiler renderer</h1>
  <p class="lede">Discord / Reddit pattern. Click to commit-reveal; row re-render re-redacts.</p>
  <div class="panel" data-controller="grid">
    <table><thead><tr>
      <th data-controller="header-cell" data-header-cell-field-value="movie" data-header-cell-width-value="220">Movie</th>
      <th data-controller="header-cell" data-header-cell-field-value="twist" data-header-cell-cell-renderer-value="spoiler" data-header-cell-width-value="400">Plot twist</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { movie: 'The Sixth Sense', twist: 'Bruce Willis was dead the whole time.' },
      { movie: 'Fight Club',      twist: 'Tyler Durden is the narrator.' },
      { movie: 'The Empire Strikes Back', twist: 'Darth Vader is Luke’s father.' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body></html>
