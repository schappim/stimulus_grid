<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>132 — XML renderer | stimulus_grid</title><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="../dist/stimulus_grid.css"/><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p.lede{color:#6b7280;margin-top:0}.panel{height:460px;margin-top:16px}.crumbs a{color:#2563eb;text-decoration:none}</style></head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>132 — XML / SOAP preview</h1>
  <p class="lede">Same as YAML preview — mono, clamped, no syntax highlighting.</p>
  <div class="panel" data-controller="grid">
    <table><thead><tr>
      <th data-controller="header-cell" data-header-cell-field-value="msg" data-header-cell-width-value="160">Message</th>
      <th data-controller="header-cell" data-header-cell-field-value="body" data-header-cell-cell-renderer-value="xml" data-header-cell-width-value="420">Body</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { msg: 'ping',  body: '<ping><host>db.local</host><timeout>30</timeout></ping>' },
      { msg: 'order', body: '<order id="O-1001">\n  <customer>Astrid</customer>\n  <total currency="AUD">412.50</total>\n  <status>paid</status>\n</order>' },
      { msg: 'fault', body: '<fault><code>500</code><message>upstream timeout</message></fault>' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body></html>
