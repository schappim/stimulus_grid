<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>152 — Gas certificate | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>152 — Gas Work Authorisation / Compliance Certificate</h1>
  <p class="lede">
    State-issued gas work cert — ESV (VIC), Energy Safe SA, etc.
    <em>Type A</em> = commercial appliances; <em>Type B</em> = industrial
    work scope. Both ranges are surfaced via the <code>class</code> field.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="installer"
              data-header-cell-width-value="200">Installer</th>
          <th data-controller="header-cell" data-header-cell-field-value="site"
              data-header-cell-width-value="200">Site</th>
          <th data-controller="header-cell" data-header-cell-field-value="cert"
              data-header-cell-cell-renderer-value="gas-certificate"
              data-header-cell-editable-value="true"
              data-header-cell-width-value="340">Gas cert</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, installer: 'Alpha Gas',  site: '12 Smith St, Bondi',     cert: { state: 'NSW', number: 'GAS-99102', class: 'Type A', expires: inDays(900) } },
      { id: 2, installer: 'Beta Gas',   site: 'Olympic Pool, Carlton',  cert: { state: 'VIC', number: 'CCG-44512', class: 'Type B', expires: inDays(120) } },
      { id: 3, installer: 'Gamma Gas',  site: 'Brewery, Newstead',      cert: { state: 'QLD', number: 'GA-22038',  class: 'Type B', expires: inDays(25) } },
      { id: 4, installer: 'Delta Gas',  site: 'Stadium, Adelaide',      cert: { state: 'SA',  number: 'GS-99102',  class: 'Type A', expires: inDays(-9) } },
      { id: 5, installer: 'Epsilon Gas',site: 'Mine site, Pilbara',     cert: { state: 'WA',  number: 'GAS-77541' } },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
