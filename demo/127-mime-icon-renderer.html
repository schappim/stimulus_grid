<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>127 — MIME icon renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>127 — MIME icon renderer</h1>
  <p class="lede">Just the emoji glyph — for file-listing grids where the filename lives in another column.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="file" data-header-cell-cell-renderer-value="mime-icon" data-header-cell-width-value="40">·</th>
        <th data-controller="header-cell" data-header-cell-field-value="name" data-header-cell-width-value="240">Name</th>
        <th data-controller="header-cell" data-header-cell-field-value="kind" data-header-cell-width-value="200">Kind</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { name: 'march-receipts.pdf',  file: { content_type: 'application/pdf',   filename: 'march-receipts.pdf' }, kind: 'PDF document' },
      { name: 'office-photo.jpg',    file: { content_type: 'image/jpeg',        filename: 'office-photo.jpg' },   kind: 'Image' },
      { name: 'voicemail.m4a',       file: { content_type: 'audio/mp4',         filename: 'voicemail.m4a' },      kind: 'Audio' },
      { name: 'highlights.mp4',      file: { content_type: 'video/mp4',         filename: 'highlights.mp4' },     kind: 'Video' },
      { name: 'archive.zip',         file: 'application/zip',                                                       kind: 'Archive' },
      { name: 'README.md',           file: 'text/markdown',                                                         kind: 'Markdown' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
