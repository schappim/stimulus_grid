<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>140 — Battery renderer | stimulus_grid</title><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="../dist/stimulus_grid.css"/><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p.lede{color:#6b7280;margin-top:0}.panel{height:460px;margin-top:16px}.crumbs a{color:#2563eb;text-decoration:none}</style></head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>140 — Battery renderer</h1>
  <p class="lede">0-100% level icon. Red below 15%, amber below 35%, green otherwise.</p>
  <div class="panel" data-controller="grid">
    <table><thead><tr>
      <th data-controller="header-cell" data-header-cell-field-value="device" data-header-cell-width-value="200">Device</th>
      <th data-controller="header-cell" data-header-cell-field-value="battery" data-header-cell-cell-renderer-value="battery" data-header-cell-width-value="180">Battery</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { device: 'astrid-mbp',  battery: 96 },
      { device: 'office-ap',    battery: 88 },
      { device: 'lab-pi-3',     battery: 42 },
      { device: 'rogue-device', battery: 18 },
      { device: 'broken-iPad',  battery: 6  },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body></html>
