<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>108 — Mini line chart (multi-series) | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>108 — Mini line chart (multi-series)</h1>
  <p class="lede">Sibling to <code>sparkline</code>, but renders multiple series overlaid. Accepts <code>[[s1...], [s2...]]</code> or <code>{ series: [{ color, data }] }</code> for per-series colour.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="city" data-header-cell-width-value="200">City</th>
        <th data-controller="header-cell" data-header-cell-field-value="temps" data-header-cell-cell-renderer-value="mini-line-chart" data-header-cell-width-value="200">Hi / Lo (7 days)</th>
        <th data-controller="header-cell" data-header-cell-field-value="forecast" data-header-cell-width-value="160">Forecast</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { city: 'Sydney',    temps: [[24,26,28,30,29,27,25], [16,17,18,19,18,17,16]], forecast: 'Sunny'  },
      { city: 'Melbourne', temps: [[18,21,23,20,17,19,22], [11,13,14,12,10,11,13]], forecast: 'Showers' },
      { city: 'Brisbane',  temps: [[28,29,30,31,30,29,28], [20,21,22,22,21,20,19]], forecast: 'Humid'  },
      { city: 'Perth',     temps: [[22,24,26,28,30,29,27], [14,15,16,17,18,17,16]], forecast: 'Fine'   },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
