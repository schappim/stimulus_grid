<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>198 — Region classifier | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>198 — Region classifier (Metro / Regional / Remote)</h1>
  <p class="lede">
    ABS Remoteness Areas-aligned pill — Metro, Inner Regional, (Outer)
    Regional, Remote, Very Remote. Drives travel-rate multipliers and
    after-hours / weekend / holiday surcharges on quote templates.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="suburb"
              data-header-cell-width-value="220">Suburb</th>
          <th data-controller="header-cell" data-header-cell-field-value="region"
              data-header-cell-cell-renderer-value="region-classifier"
              data-header-cell-width-value="200">Region</th>
          <th data-controller="header-cell" data-header-cell-field-value="multiplier"
              data-header-cell-cell-renderer-value="percent"
              data-header-cell-type-value="number"
              data-header-cell-width-value="140">Travel ×</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, suburb: 'Bondi (Sydney)',         region: 'metro',          multiplier: 100 },
      { id: 2, suburb: 'Wollongong',              region: 'inner-regional', multiplier: 110 },
      { id: 3, suburb: 'Dubbo',                   region: 'outer-regional', multiplier: 130 },
      { id: 4, suburb: 'Broken Hill',             region: 'remote',         multiplier: 175 },
      { id: 5, suburb: 'Birdsville',              region: 'very-remote',    multiplier: 250 },
      { id: 6, suburb: 'Newcastle',               region: 'regional',       multiplier: 120 },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
