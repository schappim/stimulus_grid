<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>174 — Invoice status | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>174 — Invoice status</h1>
  <p class="lede">
    Lifecycle pill: <em>draft → sent → viewed → paid</em>, plus
    exception states <em>overdue</em>, <em>disputed</em>, <em>void</em>,
    <em>written-off</em>.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="ref"
              data-header-cell-width-value="120">Invoice #</th>
          <th data-controller="header-cell" data-header-cell-field-value="customer"
              data-header-cell-width-value="200">Customer</th>
          <th data-controller="header-cell" data-header-cell-field-value="status"
              data-header-cell-cell-renderer-value="invoice-status"
              data-header-cell-width-value="180">Status</th>
          <th data-controller="header-cell" data-header-cell-field-value="amount"
              data-header-cell-cell-renderer-value="currency"
              data-header-cell-type-value="number"
              data-header-cell-width-value="140">Amount</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    StimulusGrid.registerRenderer('currency', StimulusGrid.renderers.currency({ currency: 'AUD', locale: 'en-AU' }));
    const ROWS = [
      { id: 1, ref: 'INV-2042', customer: 'Bondi Pavilion',  status: 'draft',       amount: 1240 },
      { id: 2, ref: 'INV-2043', customer: 'Vega Studio',     status: 'sent',        amount: 4800 },
      { id: 3, ref: 'INV-2044', customer: 'Coogee Holdings', status: 'viewed',      amount: 22500 },
      { id: 4, ref: 'INV-2045', customer: 'Manly Reno Co',   status: 'paid',        amount: 9870 },
      { id: 5, ref: 'INV-2046', customer: 'Glebe Builders',  status: 'overdue',     amount: 3300 },
      { id: 6, ref: 'INV-2047', customer: 'Pyrmont Pubs',    status: 'disputed',    amount: 1450 },
      { id: 7, ref: 'INV-2048', customer: 'Newtown Bakery',  status: 'void',        amount: 0 },
      { id: 8, ref: 'INV-2049', customer: 'Surry Hills Cafe',status: 'written-off', amount: 240 },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
