<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>81 — Split button renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
    #log { margin-top: 8px; padding: 8px; background: #f9fafb; border-radius: 4px;
           font-family: ui-monospace, monospace; font-size: 12px; color: #374151; min-height: 40px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>81 — Split button renderer</h1>
  <p class="lede">
    Two halves: left fires the primary action; right opens a dropdown
    menu with secondary actions. Great for "Publish / Save draft /
    Schedule…" or "Approve / Approve with edits…" patterns.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="title"
              data-header-cell-width-value="300">Post title</th>
          <th data-controller="header-cell" data-header-cell-field-value="status"
              data-header-cell-width-value="120">Status</th>
          <th data-controller="header-cell" data-header-cell-field-value="_publish"
              data-header-cell-cell-renderer-value="sb-publish"
              data-header-cell-width-value="180">Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="log">Click "Publish" — or the caret for more options.</div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const { registerRenderer, renderers } = StimulusGrid;

    registerRenderer('sb-publish', renderers.splitButton({
      primary: { label: 'Publish', action: 'publish' },
      items: [
        { label: 'Schedule for later…', action: 'schedule',  icon: '🕒' },
        { label: 'Save as draft',       action: 'save_draft', icon: '✎' },
        '---',
        { label: 'Discard changes',     action: 'discard',   icon: '↺', danger: true },
      ],
    }));

    const data = [
      { id: 1, title: 'Spring sale announcement — final draft', status: 'Draft' },
      { id: 2, title: 'New feature: bulk imports',              status: 'Draft' },
      { id: 3, title: 'Roadmap update Q3',                      status: 'Review' },
      { id: 4, title: 'Engineering culture retrospective',      status: 'Draft' },
    ];

    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });

    const log = document.getElementById('log');
    grid.addEventListener('grid:rowAction', (e) => {
      log.textContent = `▶ ${e.detail.action} on "${e.detail.row.title}" (row ${e.detail.rowId})`;
    });
  </script>
</body>
</html>
