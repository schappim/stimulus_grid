<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>107 — Mini bar chart | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>107 — Mini bar chart (categorical)</h1>
  <p class="lede">Per-category bars. Distinct from <code>histogram</code> (frequency distribution): each bar is a discrete category. Accepts <code>[{ label, value, color? }]</code> or a plain number array.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="region" data-header-cell-width-value="180">Region</th>
        <th data-controller="header-cell" data-header-cell-field-value="weekly" data-header-cell-cell-renderer-value="mini-bar-chart" data-header-cell-width-value="160">Weekly orders</th>
        <th data-controller="header-cell" data-header-cell-field-value="total" data-header-cell-type-value="number" data-header-cell-cell-renderer-value="number" data-header-cell-width-value="120">Total</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { region: 'APAC',  weekly: [120, 180, 240, 190, 270, 310, 280], total: 1590 },
      { region: 'EMEA',  weekly: [90, 130, 180, 120, 200, 240, 210],   total: 1170 },
      { region: 'NA',    weekly: [220, 280, 340, 290, 370, 410, 380],  total: 2290 },
      { region: 'LATAM', weekly: [40, 60, 80, 70, 90, 110, 100],        total: 550  },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
