<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>122 — Social link renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>122 — Social link renderer</h1>
  <p class="lede">Auto-detects Twitter / X / LinkedIn / GitHub / YouTube / Instagram / Mastodon / Bluesky / Reddit / Medium / Substack. Renders the handle as <code>@<i>name</i></code> with a tinted provider badge.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="person" data-header-cell-width-value="200">Person</th>
        <th data-controller="header-cell" data-header-cell-field-value="profile" data-header-cell-cell-renderer-value="social-link" data-header-cell-type-value="url" data-header-cell-editable-value="true" data-header-cell-width-value="280">Profile</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { person: 'Marcus Schappi',   profile: 'https://github.com/schappim' },
      { person: 'Linus Torvalds',   profile: 'https://x.com/Linus_Torvalds' },
      { person: 'Anthropic',         profile: 'https://linkedin.com/company/anthropicresearch' },
      { person: 'YouTube channel',   profile: 'https://www.youtube.com/@anthropic-ai' },
      { person: 'Mastodon',          profile: 'https://mastodon.social/@anthropic' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
