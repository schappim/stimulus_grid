<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>196 — Lot plan | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>196 — Lot plan (Lot 12 DP 456789 cadastral identifier)</h1>
  <p class="lede">
    The cadastral title reference for every AU residential property.
    "Lot N DP nnnnnn" (Deposited Plan) or "Lot N SP nnnnnn" (Strata
    Plan) — what the contract of sale, planning portal, and council
    records all key off.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="address"
              data-header-cell-width-value="280">Address</th>
          <th data-controller="header-cell" data-header-cell-field-value="lp"
              data-header-cell-cell-renderer-value="lot-plan"
              data-header-cell-width-value="220">Lot / Plan</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, address: '12 Smith St, Bondi',         lp: { lot: 12, dp: 456789 } },
      { id: 2, address: '4/22 Bay St, Bondi',         lp: { lot: 4,  sp: 4421 } },
      { id: 3, address: '88 River Rd, Bulimba',       lp: { lot: 33, dp: 11220 } },
      { id: 4, address: 'Unit 8, 4 Riley St, Surry H',lp: { lot: 8,  sp: 5544 } },
      { id: 5, address: 'Bare-land block, Daylesford',lp: { lot: 1,  plan: 'TP 882001', planType: 'TP' } },
      { id: 6, address: 'Penthouse, 1 Macquarie',     lp: 'Lot 99 SP 22008' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
