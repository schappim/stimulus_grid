<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>119 — Fresh cell renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    .ctrls { margin-top: 12px; }
    button {
      appearance: none; border: 1px solid #d1d5db; background: #fff; color: #1f2937;
      padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #f3f4f6; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>119 — Fresh cell renderer</h1>
  <p class="lede">Yellow "just updated" highlight that fades after a few seconds. Inverse of <code>stale</code>.</p>

  <div class="ctrls">
    <button id="poke">Poke a random cell</button>
  </div>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="metric" data-header-cell-width-value="200">Metric</th>
        <th data-controller="header-cell" data-header-cell-field-value="value" data-header-cell-cell-renderer-value="fresh-5" data-header-cell-width-value="200">Value</th>
        <th data-controller="header-cell" data-header-cell-field-value="updated_at" data-header-cell-cell-renderer-value="relative-time" data-header-cell-width-value="160">Updated</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const { registerRenderer, renderers } = StimulusGrid;
    registerRenderer('fresh-5', renderers.freshCell({ timestampField: 'updated_at', freshFor: 4000 }));

    let id = 1;
    const data = [
      { id: id++, metric: 'orders_per_hour',      value: '12.4',  updated_at: new Date(Date.now() - 60_000) },
      { id: id++, metric: 'p95_latency',          value: '184ms', updated_at: new Date(Date.now() - 120_000) },
      { id: id++, metric: 'queue_depth',          value: '422',   updated_at: new Date(Date.now() - 90_000) },
      { id: id++, metric: 'paid_conversion_rate', value: '3.1%',  updated_at: new Date(Date.now() - 60_000) },
    ];

    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
    document.getElementById('poke').addEventListener('click', () => {
      const r = data[Math.floor(Math.random() * data.length)];
      r.value = Math.round(Math.random() * 1000) / 10;
      r.updated_at = new Date();
      grid.gridApi.applyTransaction({ update: [r] });
    });
  </script>
</body>
</html>
