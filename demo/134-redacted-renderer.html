<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>134 — Redacted renderer | stimulus_grid</title><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="../dist/stimulus_grid.css"/><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p.lede{color:#6b7280;margin-top:0}.panel{height:460px;margin-top:16px}.crumbs a{color:#2563eb;text-decoration:none}</style></head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>134 — Redacted renderer</h1>
  <p class="lede">Black-bar redaction. Hold the mouse button down to peek; release re-redacts.</p>
  <div class="panel" data-controller="grid">
    <table><thead><tr>
      <th data-controller="header-cell" data-header-cell-field-value="customer" data-header-cell-width-value="200">Customer</th>
      <th data-controller="header-cell" data-header-cell-field-value="dob" data-header-cell-cell-renderer-value="redacted" data-header-cell-width-value="180">DOB</th>
      <th data-controller="header-cell" data-header-cell-field-value="ssn" data-header-cell-cell-renderer-value="redacted" data-header-cell-width-value="180">SSN</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { customer: 'Astrid Hale', dob: '1992-03-14', ssn: '123-45-6789' },
      { customer: 'Marcus Chen', dob: '1988-07-22', ssn: '987-65-4321' },
      { customer: 'Priya Patel', dob: '1995-11-04', ssn: '111-22-3333' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body></html>
