<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>155 — Pool safety certificate | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>155 — Pool Safety Certificate (QLD Form 23)</h1>
  <p class="lede">
    QBCC-issued pool safety inspector authorisation. 2-year renewal cycle.
    Mandatory for any pre-sale / pre-lease pool inspection in Queensland.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="address"
              data-header-cell-width-value="240">Pool address</th>
          <th data-controller="header-cell" data-header-cell-field-value="inspector"
              data-header-cell-width-value="180">Inspector</th>
          <th data-controller="header-cell" data-header-cell-field-value="cert"
              data-header-cell-cell-renderer-value="pool-safety-cert"
              data-header-cell-editable-value="true"
              data-header-cell-width-value="340">Cert (Form 23)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, address: '12 Smith St, Sandgate',     inspector: 'Astrid Hale',  cert: { state: 'QLD', number: 'F23-99201', class: 'Class 1', expires: inDays(600) } },
      { id: 2, address: 'Unit 4/22 Bay Tce, Wynnum', inspector: 'Marcus Chen',  cert: { state: 'QLD', number: 'F23-12340', class: 'Class 2', expires: inDays(120) } },
      { id: 3, address: '88 River Rd, Bulimba',      inspector: 'Priya Patel',  cert: { state: 'QLD', number: 'F23-44510', class: 'Class 1', expires: inDays(30) } },
      { id: 4, address: '5 Ocean Ave, Burleigh',     inspector: 'Jamal Owens',  cert: { state: 'QLD', number: 'F23-77098', class: 'Class 1', expires: inDays(-22) } },
      { id: 5, address: '17 Pine St, Toowong',       inspector: 'Lena Brooks',  cert: { state: 'QLD', number: 'F23-22038' } },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
