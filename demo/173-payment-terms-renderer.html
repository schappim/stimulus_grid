<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>173 — Payment terms | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>173 — Payment terms</h1>
  <p class="lede">
    Invoice payment terms — Net 7 / 14 / 30 / EOM / COD / Prepaid. Pass
    a string for a plain pill, or <code>{ terms, dueDate }</code> to
    surface an overdue red flag when the due date is in the past.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="ref"
              data-header-cell-width-value="120">Invoice #</th>
          <th data-controller="header-cell" data-header-cell-field-value="customer"
              data-header-cell-width-value="200">Customer</th>
          <th data-controller="header-cell" data-header-cell-field-value="terms"
              data-header-cell-cell-renderer-value="payment-terms"
              data-header-cell-width-value="220">Terms</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, ref: 'INV-2042', customer: 'Bondi Pavilion',  terms: 'COD' },
      { id: 2, ref: 'INV-2043', customer: 'Vega Studio',     terms: 'Prepaid' },
      { id: 3, ref: 'INV-2044', customer: 'Coogee Holdings', terms: { terms: 'Net 7',  dueDate: inDays(5) } },
      { id: 4, ref: 'INV-2045', customer: 'Manly Reno Co',   terms: { terms: 'Net 14', dueDate: inDays(-3) } },
      { id: 5, ref: 'INV-2046', customer: 'Glebe Builders',  terms: { terms: 'Net 30', dueDate: inDays(12) } },
      { id: 6, ref: 'INV-2047', customer: 'Pyrmont Pubs',    terms: 'EOM' },
      { id: 7, ref: 'INV-2048', customer: 'Newtown Bakery',  terms: { terms: 'Net 30', dueDate: inDays(-21) } },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
