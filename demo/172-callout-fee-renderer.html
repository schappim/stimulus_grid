<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>172 — Callout fee | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>172 — Callout fee</h1>
  <p class="lede">
    Service-call disposition pill. Accepts a bare number ($ amount), one
    of <code>'charged' | 'waived' | 'included'</code>, or
    <code>{ amount, status }</code> for both at once.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="ref"
              data-header-cell-width-value="120">Job #</th>
          <th data-controller="header-cell" data-header-cell-field-value="customer"
              data-header-cell-width-value="180">Customer</th>
          <th data-controller="header-cell" data-header-cell-field-value="callout"
              data-header-cell-cell-renderer-value="callout-fee"
              data-header-cell-width-value="200">Callout fee</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, ref: 'J-1042', customer: 'Bondi Pavilion',  callout: 120 },
      { id: 2, ref: 'J-1043', customer: 'Vega Studio',     callout: { amount: 85, status: 'charged' } },
      { id: 3, ref: 'J-1044', customer: 'Coogee Holdings', callout: 'waived' },
      { id: 4, ref: 'J-1045', customer: 'Manly Reno Co',   callout: 'included' },
      { id: 5, ref: 'J-1046', customer: 'Glebe Builders',  callout: { amount: 220, status: 'charged' } },
      { id: 6, ref: 'J-1047', customer: 'Pyrmont Pubs',    callout: null },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
