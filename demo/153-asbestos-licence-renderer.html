<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>153 — Asbestos removal licence | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>153 — Asbestos removal licence (SafeWork)</h1>
  <p class="lede">
    SafeWork-issued, state-based. Class A (friable) covers the high-risk
    work and demands continuous air-monitoring; Class B (non-friable) is
    limited to bonded/cement-sheet material.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="contractor"
              data-header-cell-width-value="220">Contractor</th>
          <th data-controller="header-cell" data-header-cell-field-value="supervisor"
              data-header-cell-width-value="180">Supervisor</th>
          <th data-controller="header-cell" data-header-cell-field-value="licence"
              data-header-cell-cell-renderer-value="asbestos-licence"
              data-header-cell-editable-value="true"
              data-header-cell-width-value="340">Licence</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, contractor: 'Alpha Asbestos',  supervisor: 'Astrid Hale',  licence: { state: 'NSW', number: 'A-44210', class: 'Class A', expires: inDays(900) } },
      { id: 2, contractor: 'Beta Remediation',supervisor: 'Marcus Chen',  licence: { state: 'VIC', number: 'B-55124', class: 'Class B', expires: inDays(75) } },
      { id: 3, contractor: 'Gamma Removalists',supervisor: 'Priya Patel', licence: { state: 'QLD', number: 'A-22038', class: 'Class A', expires: inDays(28) } },
      { id: 4, contractor: 'Delta Demolition',supervisor: 'Jamal Owens',  licence: { state: 'SA',  number: 'B-99102', class: 'Class B', expires: inDays(-30) } },
      { id: 5, contractor: 'Epsilon Site',    supervisor: 'Lena Brooks',  licence: { state: 'WA',  number: 'A-77541' } },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
