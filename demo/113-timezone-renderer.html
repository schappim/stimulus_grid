<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>113 — Timezone renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>113 — Timezone renderer</h1>
  <p class="lede">IANA tz string + current UTC offset, e.g. <code>Sydney (UTC+10)</code>. Full tz string in the tooltip.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="user" data-header-cell-width-value="200">User</th>
        <th data-controller="header-cell" data-header-cell-field-value="tz" data-header-cell-cell-renderer-value="timezone" data-header-cell-width-value="220">Time zone</th>
        <th data-controller="header-cell" data-header-cell-field-value="tz" data-header-cell-cell-renderer-value="tz-raw" data-header-cell-width-value="240">Raw</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const { registerRenderer, renderers } = StimulusGrid;
    registerRenderer('tz-raw', renderers.timezone({ withCity: false }));
    const data = [
      { user: 'Astrid Hale', tz: 'Australia/Sydney'    },
      { user: 'Marcus Chen', tz: 'America/Los_Angeles' },
      { user: 'Priya Patel', tz: 'Asia/Kolkata'        },
      { user: 'Lena Brooks', tz: 'Europe/London'       },
      { user: 'Tomás Vega',  tz: 'Europe/Madrid'       },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
