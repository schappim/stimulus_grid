<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>05 — Pagination | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 480px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>05 — Pagination</h1>
  <p class="lede">
    Pagination is enabled on the grid with <code>data-grid-pagination-value="true"</code> and
    <code>data-grid-page-size-value="20"</code>. The footer is a separate
    <code>pagination</code> controller wired by an outlet:
    <code>data-pagination-grid-outlet="#athletes"</code>.
  </p>

  <div id="athletes" class="panel"
       data-controller="grid"
       data-grid-row-data-url-value="./data/athletes.json"
       data-grid-pagination-value="true"
       data-grid-page-size-value="20">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="athlete"
              data-header-cell-sortable-value="true" data-header-cell-filter-value="text"
              data-header-cell-width-value="200">Athlete</th>
          <th data-controller="header-cell" data-header-cell-field-value="age"
              data-header-cell-type-value="number" data-header-cell-sortable-value="true"
              data-header-cell-filter-value="number" data-header-cell-width-value="80">Age</th>
          <th data-controller="header-cell" data-header-cell-field-value="country"
              data-header-cell-sortable-value="true" data-header-cell-filter-value="text"
              data-header-cell-width-value="180">Country</th>
          <th data-controller="header-cell" data-header-cell-field-value="sport"
              data-header-cell-sortable-value="true" data-header-cell-filter-value="text"
              data-header-cell-width-value="200">Sport</th>
          <th data-controller="header-cell" data-header-cell-field-value="date"
              data-header-cell-type-value="date" data-header-cell-sortable-value="true"
              data-header-cell-filter-value="date" data-header-cell-width-value="120">Date</th>
          <th data-controller="header-cell" data-header-cell-field-value="gold"
              data-header-cell-type-value="number" data-header-cell-sortable-value="true"
              data-header-cell-filter-value="number" data-header-cell-width-value="80">Gold</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <nav class="sg-pagination"
       data-controller="pagination"
       data-pagination-grid-outlet="#athletes">
    <button data-pagination-target="first" data-action="pagination#first" title="First page">«</button>
    <button data-pagination-target="prev"  data-action="pagination#prev"  title="Previous page">‹</button>
    <span class="sg-spacer"></span>
    <span data-pagination-target="pageInfo">…</span>
    <span class="sg-spacer"></span>
    <button data-pagination-target="next"  data-action="pagination#next"  title="Next page">›</button>
    <button data-pagination-target="last"  data-action="pagination#last"  title="Last page">»</button>
    <label>Rows per page
      <select data-pagination-target="pageSize" data-action="change->pagination#changeSize">
        <option>10</option>
        <option selected>20</option>
        <option>50</option>
        <option>100</option>
      </select>
    </label>
  </nav>

  <script src="../dist/stimulus_grid.js"></script>
  <script>StimulusGrid.start();</script>
</body>
</html>
