<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>101 — VIN renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>101 — VIN renderer</h1>
  <p class="lede">
    17-character Vehicle Identification Number split into the three
    semantic blocks: WMI (1-3) · VDS (4-9) · VIS (10-17).
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="reg"
              data-header-cell-width-value="120">Reg</th>
          <th data-controller="header-cell" data-header-cell-field-value="vin"
              data-header-cell-cell-renderer-value="vin"
              data-header-cell-width-value="260">VIN</th>
          <th data-controller="header-cell" data-header-cell-field-value="make"
              data-header-cell-width-value="120">Make</th>
          <th data-controller="header-cell" data-header-cell-field-value="model"
              data-header-cell-width-value="160">Model</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { reg: 'AAA 001', vin: '1HGCM82633A004352', make: 'Honda',     model: 'Accord'   },
      { reg: 'BBB 002', vin: 'JH4DA9460PS001234', make: 'Acura',     model: 'Integra'  },
      { reg: 'CCC 003', vin: 'WAUZZZ8E76A123456', make: 'Audi',      model: 'A4'       },
      { reg: 'DDD 004', vin: 'TOO-SHORT-VIN',    make: 'Unknown',   model: 'Invalid'  },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
