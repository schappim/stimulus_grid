<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>186 — Subcontractor | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>186 — Subcontractor (compliance roll-up)</h1>
  <p class="lede">
    "Can we send this sub today?" composite. Rolls licence / insurance /
    SWMS / induction flags into a single ✓ / ⚠ / ✗ icon with the failing
    requirement listed inline. Hover the icon for the full list.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="sub"
              data-header-cell-cell-renderer-value="subcontractor"
              data-header-cell-width-value="360">Subcontractor</th>
          <th data-controller="header-cell" data-header-cell-field-value="trade"
              data-header-cell-cell-renderer-value="trade-type"
              data-header-cell-width-value="180">Trade</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, sub: { name: 'Bondi Roofing Pty Ltd',  licence: true,  insurance: true,  swms: true,  induction: true },  trade: 'Roofer' },
      { id: 2, sub: { name: 'Vega Electrical',         licence: true,  insurance: true,  swms: false, induction: true },  trade: 'Electrician' },
      { id: 3, sub: { name: 'Coogee Concrete',         licence: true,  insurance: false, swms: true,  induction: false }, trade: 'Concreter' },
      { id: 4, sub: { name: 'Manly Plumb Pty Ltd',     licence: false, insurance: false, swms: false, induction: false }, trade: 'Plumber' },
      { id: 5, sub: { name: 'Glebe Glaziers',          licence: true,  insurance: true,  swms: true,  induction: true },  trade: 'Glazier' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
