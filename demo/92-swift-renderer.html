<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>92 — SWIFT / BIC renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>92 — SWIFT / BIC renderer</h1>
  <p class="lede">8 or 11 character ISO 9362 bank identifier. Renders as bank(4) country(2) location(2) [branch(3)].</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="bank" data-header-cell-width-value="200">Bank</th>
        <th data-controller="header-cell" data-header-cell-field-value="bic" data-header-cell-cell-renderer-value="swift" data-header-cell-width-value="200">BIC</th>
        <th data-controller="header-cell" data-header-cell-field-value="city" data-header-cell-width-value="160">City</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { bank: 'NatWest UK',     bic: 'NWBKGB2L',     city: 'London'      },
      { bank: 'Deutsche Bank',  bic: 'DEUTDEFF',     city: 'Frankfurt'   },
      { bank: 'BNP Paribas',    bic: 'BNPAFRPPXXX',  city: 'Paris'       },
      { bank: 'Westpac AU',     bic: 'WPACAU2S',     city: 'Sydney'      },
      { bank: 'INVALID',        bic: 'BAD',          city: '—'           },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
