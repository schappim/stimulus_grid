<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>94 — EIN renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>94 — EIN renderer</h1>
  <p class="lede">US Employer Identification Number — 9 digits formatted as <code>XX-XXXXXXX</code>.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="company" data-header-cell-width-value="220">Company</th>
        <th data-controller="header-cell" data-header-cell-field-value="ein" data-header-cell-cell-renderer-value="ein" data-header-cell-width-value="160">EIN</th>
        <th data-controller="header-cell" data-header-cell-field-value="state" data-header-cell-width-value="100">State</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { company: 'Acme Robotics Inc',         ein: '987654321', state: 'DE' },
      { company: 'Northwind Coffee Roasters', ein: '12-3456789', state: 'WA' },
      { company: 'Contoso Labs',              ein: '462154321',  state: 'CA' },
      { company: 'BadData LLC',               ein: '1-2',         state: '—'  },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
