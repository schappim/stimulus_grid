<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>95 — VAT renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>95 — VAT renderer</h1>
  <p class="lede">EU VAT number: 2-letter country prefix + national digits. Hover for country tooltip.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="vendor" data-header-cell-width-value="220">Vendor</th>
        <th data-controller="header-cell" data-header-cell-field-value="vat" data-header-cell-cell-renderer-value="vat" data-header-cell-width-value="200">VAT</th>
        <th data-controller="header-cell" data-header-cell-field-value="reg" data-header-cell-cell-renderer-value="date" data-header-cell-width-value="160">Registered</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { vendor: 'Adidas Deutschland', vat: 'DE127006061',   reg: '2020-02-12' },
      { vendor: 'Louis Vuitton FR',   vat: 'FR40792083044', reg: '2019-06-04' },
      { vendor: 'Argos UK',           vat: 'GB123456789',   reg: '2018-09-30' },
      { vendor: 'Bad row',            vat: 'invalid',       reg: null         },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
