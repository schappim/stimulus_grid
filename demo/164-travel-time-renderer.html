<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>164 — Travel time | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>164 — Travel time (ETA from previous stop)</h1>
  <p class="lede">
    Drive time + distance with a traffic-light dot
    (<span style="color:#22c55e">●</span> light /
    <span style="color:#f59e0b">●</span> moderate /
    <span style="color:#ef4444">●</span> heavy). Accepts a bare number
    of minutes or <code>{ minutes, distance, traffic }</code>.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="from"
              data-header-cell-width-value="200">From</th>
          <th data-controller="header-cell" data-header-cell-field-value="to"
              data-header-cell-width-value="200">To</th>
          <th data-controller="header-cell" data-header-cell-field-value="travel"
              data-header-cell-cell-renderer-value="travel-time"
              data-header-cell-width-value="200">Travel</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const ROWS = [
      { id: 1, from: 'Bondi',     to: 'Coogee',   travel: { minutes: 9,  distance: '3.4 km', traffic: 'light' } },
      { id: 2, from: 'Coogee',    to: 'Maroubra', travel: { minutes: 12, distance: '4.1 km', traffic: 'light' } },
      { id: 3, from: 'Maroubra',  to: 'CBD',      travel: { minutes: 28, distance: '11.2 km', traffic: 'moderate' } },
      { id: 4, from: 'CBD',       to: 'Newtown',  travel: { minutes: 18, distance: '5.8 km',  traffic: 'moderate' } },
      { id: 5, from: 'Newtown',   to: 'Parramatta',travel: { minutes: 44, distance: '22.0 km', traffic: 'heavy' } },
      { id: 6, from: 'Parramatta',to: 'Penrith',  travel: 32 },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
