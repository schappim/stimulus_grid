<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>131 — YAML renderer | stimulus_grid</title><meta name="viewport" content="width=device-width, initial-scale=1"/><link rel="stylesheet" href="../dist/stimulus_grid.css"/><style>body{font-family:system-ui,sans-serif;max-width:1080px;margin:40px auto;padding:0 20px}h1{margin-bottom:4px}p.lede{color:#6b7280;margin-top:0}.panel{height:460px;margin-top:16px}.crumbs a{color:#2563eb;text-decoration:none}</style></head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>131 — YAML / config preview</h1>
  <p class="lede">Mono preview clamped at 4 lines. No lexing — keeps the "no heavy deps" constraint.</p>
  <div class="panel" data-controller="grid">
    <table><thead><tr>
      <th data-controller="header-cell" data-header-cell-field-value="service" data-header-cell-width-value="160">Service</th>
      <th data-controller="header-cell" data-header-cell-field-value="config" data-header-cell-cell-renderer-value="yaml" data-header-cell-width-value="380">Config</th>
    </tr></thead><tbody></tbody></table>
  </div>
  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { service: 'api-gateway', config: 'replicas: 3\nresources:\n  cpu: 500m\n  memory: 1Gi\nautoscale:\n  min: 2\n  max: 8' },
      { service: 'auth',         config: 'replicas: 2\ntimeout_ms: 30000' },
      { service: 'billing',      config: 'replicas: 1\nresources:\n  cpu: 250m\n  memory: 512Mi' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body></html>
