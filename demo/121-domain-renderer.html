<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>121 — Domain renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>121 — Domain renderer</h1>
  <p class="lede">Host-only extract. Drops <code>www.</code> by default; click links through to the full URL.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="customer" data-header-cell-width-value="220">Customer</th>
        <th data-controller="header-cell" data-header-cell-field-value="site" data-header-cell-cell-renderer-value="domain" data-header-cell-width-value="220">Site</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { customer: 'Apple',  site: 'https://www.apple.com/au/iphone/' },
      { customer: 'Google', site: 'https://google.com/maps' },
      { customer: 'Reddit', site: 'https://old.reddit.com/r/programming' },
      { customer: 'OpenAI', site: 'https://www.openai.com/blog/' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
