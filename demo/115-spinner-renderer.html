<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>115 — Spinner renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>115 — Spinner renderer</h1>
  <p class="lede">Compact dot-spinner sibling to <code>loading-shimmer</code> — renders when the cell value matches the loading sentinel (null / '' / 'loading' / '…'), otherwise renders the value.</p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead><tr>
        <th data-controller="header-cell" data-header-cell-field-value="row" data-header-cell-width-value="60">#</th>
        <th data-controller="header-cell" data-header-cell-field-value="status" data-header-cell-cell-renderer-value="spinner" data-header-cell-width-value="100">Status</th>
        <th data-controller="header-cell" data-header-cell-field-value="result" data-header-cell-width-value="220">Result</th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const data = [
      { row: 1, status: 'done',    result: 'Imported 482 rows' },
      { row: 2, status: 'loading', result: '' },
      { row: 3, status: '…',       result: '' },
      { row: 4, status: 'done',    result: 'Imported 12 rows' },
      { row: 5, status: 'loading', result: '' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
