<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>185 — Skill endorsement | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
    .tip { margin-top: 16px; padding: 10px 14px; background: #eff6ff;
           border-left: 3px solid #2563eb; color:#1e3a8a; font-size: 13px; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>185 — Skill endorsement (competency + expiry)</h1>
  <p class="lede">
    Specific competencies that aren't full trade licences — Solar PV
    install, EV charging, EWP, confined-space entry, first aid, etc.
    Each carries its own expiry which the traffic-light pill surfaces
    next to the skill name.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="name"
              data-header-cell-width-value="180">Tradie</th>
          <th data-controller="header-cell" data-header-cell-field-value="skill"
              data-header-cell-cell-renderer-value="skill-endorsement"
              data-header-cell-width-value="320">Endorsement</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const inDays = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
    const ROWS = [
      { id: 1, name: 'Astrid Hale',  skill: { skill: 'Solar PV install',     issuer: 'CEC', expires: inDays(540) } },
      { id: 2, name: 'Marcus Chen',  skill: { skill: 'EV charging install',  issuer: 'CEC', expires: inDays(80) } },
      { id: 3, name: 'Priya Patel',  skill: { skill: 'Confined space entry',                  expires: inDays(15) } },
      { id: 4, name: 'Jamal Owens',  skill: { skill: 'First aid (HLTAID011)',                 expires: inDays(-20) } },
      { id: 5, name: 'Lena Brooks',  skill: { skill: 'EWP operator',                          expires: inDays(420) } },
      { id: 6, name: 'Tomás Vega',   skill: 'Roof safety mesh (no expiry)' },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(ROWS), { once: true });
  </script>
</body>
</html>
