<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>100 — MAC address renderer | stimulus_grid</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../dist/stimulus_grid.css" />
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1080px; margin: 40px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; }
    p.lede { color: #6b7280; margin-top: 0; }
    .panel { height: 460px; margin-top: 16px; }
    .crumbs a { color: #2563eb; text-decoration: none; }
    code { background:#f3f4f6; padding:1px 4px; border-radius:3px; font-size:.9em; }
  </style>
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>100 — MAC address renderer</h1>
  <p class="lede">
    Normalises hyphen / dot / bare-hex forms into canonical colon-separated
    lowercase. Pass a <code>vendorLookup</code> for OUI → vendor tooltip.
  </p>

  <div class="panel" data-controller="grid" data-grid-status-bar-value="true">
    <table>
      <thead>
        <tr>
          <th data-controller="header-cell" data-header-cell-field-value="host"
              data-header-cell-width-value="180">Host</th>
          <th data-controller="header-cell" data-header-cell-field-value="mac"
              data-header-cell-cell-renderer-value="mac-vendor"
              data-header-cell-width-value="200">MAC</th>
          <th data-controller="header-cell" data-header-cell-field-value="ip"
              data-header-cell-cell-renderer-value="ip-address"
              data-header-cell-width-value="160">IP</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="../dist/stimulus_grid.js"></script>
  <script>
    StimulusGrid.start();
    const { registerRenderer, renderers } = StimulusGrid;
    const OUI = {
      'a4c3f0': 'Apple',
      '001122': 'Cisco Meraki',
      '7c2f80': 'Ubiquiti',
      'b827eb': 'Raspberry Pi',
    };
    registerRenderer('mac-vendor', renderers.macAddress({ vendorLookup: (o) => OUI[o] }));
    const data = [
      { host: 'astrid-mbp',     mac: 'A4-C3-F0-12-34-56', ip: '10.0.1.21' },
      { host: 'office-ap',      mac: '00:11:22:aa:bb:cc', ip: '10.0.0.1'  },
      { host: 'lab-pi-3',       mac: 'b827eb.123456'.replace('.', ''),    ip: '10.0.2.50' },
      { host: 'rogue-device',   mac: 'not-a-mac',          ip: '10.0.3.4'  },
    ];
    const grid = document.querySelector('.panel');
    grid.addEventListener('grid:ready', () => grid.gridApi.setRowData(data), { once: true });
  </script>
</body>
</html>
